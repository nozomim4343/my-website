<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎁 誕生日プレゼント診断</title>
<style>
:root{--bg:#fff7ec;--card:#fff;--tx:#33291f;--sub:#7a6a58;--ac:#ff6b4a;--ac2:#ffd23f;--bd:#f0dcc2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231b14;--card:#322819;--tx:#fbefdc;--sub:#c4b196;--bd:#4d3d28}}
:root[data-theme="dark"]{--bg:#231b14;--card:#322819;--tx:#fbefdc;--sub:#c4b196;--bd:#4d3d28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.w{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;text-align:center;margin:8px 0}
.c{text-align:center}
.sub{font-size:13px;color:var(--sub)}
.q{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}
.q h2{font-size:15px;margin:0 0 10px}
.q h2 span{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:0 9px;margin-right:6px;font-size:13px}
label{display:block;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;font-size:14px}
label:has(input:checked){border-color:var(--ac);background:rgba(255,107,74,.12);font-weight:700}
input[type=radio]{accent-color:var(--ac);margin-right:8px}
button{width:100%;border:0;border-radius:99px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;padding:14px;margin-top:8px;cursor:pointer}
button.s{background:var(--ac2);color:#33291f}
#bar{height:8px;background:var(--bd);border-radius:9px;margin:12px 0 16px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.em{font-size:72px}
.box{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:14px 0;text-align:left}
.box li{margin:6px 0}
textarea{width:100%;height:90px;border:2px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);color:var(--tx);font-size:14px}
code{display:block;word-break:break-all;background:var(--card);border:2px dashed var(--bd);border-radius:12px;padding:8px;font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<div id="app"></div>
</div>
<script>
var V=[2,0,-2];
// [id, axis(-1=なし), 質問, 選択肢1, 2, 3]  axis: 0=インドア 1=モノ 2=実用 3=日常UP
var Q=[
["A1",0,"理想の休日は？","家でごろごろ・まったり","どっちも好き","とにかく外に出たい"],
["A2",0,"友達と遊ぶなら？","家飲み・ゲーム","その時の気分","お出かけ・アクティブ"],
["A4",1,"旅行先でテンション上がるのは？","お土産・買い物","半々","景色やご当地体験"],
["A5",2,"買い物で重視するのは？","使いやすさ・機能","バランス","見た目・ワクワク感"],
["A6",2,"グッとくるのは？","地味に役立つもの","どっちも","持ってるだけで上がるもの"],
["A7",3,"自分で買うなら？","毎日使うものは良いものを","特にこだわらない","贅沢品はたまにご褒美で"],
["A8",3,"もらって嬉しいのは？","普段の生活が快適になる","どっちも","非日常のご褒美感"],
["A3",1,"ボーナスが出たら？","ほしいものを買う","どっちも","旅行やおいしいものに使う"],
["D1",-1,"日常生活でお金をかけても改善したいのは？","面倒な作業や手間","家で過ごす時間の快適さ","外出や移動の快適さ"],
["B2",-1,"サプライズ度は？","欲しいもの確実がいい","予想外でうれしい","どっちでも"],
["B3",-1,"見た目の好みは？","シンプル・ミニマル","遊び心・個性","高級感・渋め"],
["B4",-1,"消えもの（食・体験）は？","全然OK","残るものがいい","どっちも好き"],
["C1",-1,"プレゼントの使い方は？","毎日使い倒したい","時々の特別な日に","飾る・眺める"],
["C4",-1,"わたしにもらって嬉しいのは？","自分では絶対選ばなさそうなもの","さりげなく実用的なもの","センスを感じるもの"],
["G2",-1,"もらったものを使うなら？","家","出かけたとき","仕事"],
["G4",-1,"新しいものは？","すぐ試す","評判を見てから","今あるもので十分"],
["G7",-1,"家の音まわりは？","スピーカーがある","ない","ヘッドホン派"],
["F2",-1,"気になる持ち物は？","時計","財布・カバン","香り・アクセ"],
["F3",-1,"小物系でもらうなら？","黒・ネイビー系","グレー・茶系","明るい色もOK"],
["F4",-1,"ブランドは？","こだわり強い","ちょっと気にする","全然気にしない"],
["F5",-1,"財布は？","新しくしたい","まだ使える","こだわりがある"],
["F6",-1,"腕時計は？","持ってない","いくつか持ってる","つけない"],
["F7",-1,"香りは？","好き","つけない","苦手"],
["F8",-1,"カバンは？","新しくしたい","まだ使える","こだわりがある"],
["E3",-1,"ごちそう食べるなら？","外食","作ってもらう","自分で作るのも好き"],
["E4",-1,"食の冒険は？","珍しいもの好き","定番が好き","特にこだわりなし"],
["D2",-1,"外食をするなら？","普段よりぜいたくな食事","珍しい料理や初めてのお店","景色や雰囲気も楽しめるお店"],
["X1",-1,"わたしと行くなら？","旅行・温泉","ライブ・観戦","アクティビティ"],
["X3",-1,"ペースは？","のんびり","アクティブ","気分で"],
["X4",-1,"初めての体験は？","やってみたい","どっちでも","慣れた方が安心"],
["X6",-1,"サプライズは？","大好き","照れる","苦手"],
["X8",-1,"季節は？","暑い時期が好き","寒い時期が好き","いつでも"],
["R1",-1,"疲れた時は？","お風呂・マッサージ","とにかく寝る","好きなものを食べる"],
["R2",-1,"睡眠は？","こだわる","ふつう","浅い方"],
["R4",-1,"癒されるのは？","香りや音","手触り","景色・間接照明"],
["R6",-1,"肩こりや疲れは？","よくある","たまに","ない"],
["R7",-1,"寝る前は？","スマホを見がち","本・音楽","すぐ寝る"]];
var N=Q.length,PS=8,NP=Math.ceil(N/PS);
// ideas: [text, score(a)=0なら除外/大きいほど優先, 1=消えもの]
var G=[
{n:"ガジェット探検家",e:"🎧",v:[1,1,1,1],c:"新しい便利、見つけたら試したい！",i:[
["Mac・iPhoneまわりのガジェット（アルミスタンド・USBハブ・ワイヤレスキーボード/マウス、1〜2万円）",function(a){return a.G2==2||a.D1==0?2:1}],
["MagSafe対応モバイルバッテリー＆充電スタンド（〜1万円）",function(a){return a.G2==1||a.D1==2?2:1}],
["ポータブルスピーカー（Bose・Marshallなど、2〜3万円）",function(a){return a.G7==0?0:a.G7==1?2:1}],
["ノイズキャンセリングヘッドホン（Sony・Boseの型落ち上位機、2〜3万円台）",function(a){return a.G7==2||a.D1==2?2:1}],
["上質なレザーケース・ポーチ（スマホ・Mac用、〜2万円）"]]},
{n:"おしゃれ小物マスター",e:"⌚",v:[-1,1,-1,-1],c:"身につけるもので気分を上げたい！",i:[
["きれいめ腕時計（SEIKO・Citizenなど、2〜3万円）",function(a){return a.F6==2?0:a.F2==0||a.F6==0?2:1}],
["上質な革財布（土屋鞄・Dakotaなど、2〜3万円）",function(a){return a.F5==0||a.F2==1?2:1}],
["上質なレザーバッグ（ボディバッグ・ショルダー、2〜3万円）",function(a){return a.F8==0||a.F2==1||a.D1==2?2:1}],
["フレグランス（ジョーマローン等、1〜2万円台）",function(a){return a.F7!=0?0:a.F2==2?2:1},1],
["上質なカードケース＆キーケース（〜2万円）"]]},
{n:"グルメ＆お酒の達人",e:"🍷",v:[1,-1,-1,-1],c:"おいしい時間こそ最高のぜいたく！",i:[
["高級和牛のお取り寄せ（A5ステーキ・すき焼きなど、1〜3万円）",function(a){return a.D2==0?3:2},1],
["うなぎ・海鮮のお取り寄せ（1〜2万円）",null,1],
["高級スイーツ・チョコの詰め合わせ（〜1万円）",null,1],
["人気レストランのペアディナー券（2〜3万円）",function(a){return a.E3==0||a.D2>0?2:1}],
["自宅で楽しむお取り寄せごちそうコース（2〜3万円）",function(a){return a.E3==1?2:1},1],
["本格スパイス・調理器具セット（1〜2万円）",function(a){return a.E3==2?2:0}],
["ちょっといいグラス・ペアのお皿セット（〜2万円）",function(a){return a.B4==1?2:0}]]},
{n:"思い出コレクター",e:"🎢",v:[-1,-1,-1,-1],c:"モノより一緒に過ごす時間が宝物！",i:[
["温泉旅館・記念日向け宿泊ギフト（ペア1泊、2〜3万円）",function(a){return a.X1==0?2:1}],
["ライブ・スポーツ観戦のペアチケット（1〜3万円）",function(a){return a.X1==1?2:0}],
["ふたりで体験ギフト（気球・クルーズ・ディナー、2〜3万円）",function(a){return a.X1==2||a.D2==2?2:a.X4==2?0:1}],
["ふたりで絶景ドライブ＆宿泊（〜3万円）",function(a){return a.D2==2?2:1}],
["日帰り温泉・スパのペアチケット（〜1万円）"]]},
{n:"のんびり快適マイスター",e:"🛋️",v:[1,1,1,-1],c:"おうちを極上の居心地にしたい！",i:[
["上質なパジャマ・ルームウェア（〜2万円）",function(a){return a.R4==1||a.D1==1?2:1}],
["マッサージガン（Theragunなど、2〜3万円）",function(a){return a.R1==0||a.R6==0||a.D1==1?2:1}],
["高品質な枕・寝具（1〜3万円）",function(a){return a.R2==1?0:2}],
["アロマディフューザー・上質なキャンドル（〜1万円）",function(a){return a.R4==0?2:0},1],
["間接照明（おしゃれなランプ、〜2万円）",function(a){return a.R4==2?2:0}],
["ちょっといい入浴剤＆バスグッズ（〜1万円）",function(a){return a.R1==0?1:0},1],
["上質なタオル・ルームシューズのセット（〜1万円）"]]}];
var app=document.getElementById("app"),AN=[];
function toObj(d){var o={};Q.forEach(function(q,i){o[q[0]]=+d[i]});return o}
function rank(a){var s=[0,0,0,0];Q.forEach(function(q){if(q[1]>=0)s[q[1]]+=V[a[q[0]]]});
 return G.map(function(g,i){return[i,g.v.reduce(function(t,x,k){return t+x*s[k]},0)]}).sort(function(x,y){return y[1]-x[1]})}
function pick(g,a,n){return g.i.map(function(x,j){var s=x[1]?x[1](a):1;if(x[2]&&a.B4==1)s=0;return[x[0],s,j]}).filter(function(x){return x[1]>0}).sort(function(p,q){return q[1]-p[1]||p[2]-q[2]}).slice(0,n).map(function(x){return"<li>"+x[0]+"</li>"}).join("")}
function page(p){var qs=Q.slice(p*PS,p*PS+PS);
 var h='<h1>🎁 プレゼント診断</h1><p class="c sub">'+(p==0?'直感でポチポチ答えてね！':'その調子！')+'（'+(p+1)+' / '+NP+'ページ）</p><div id="bar"><i></i></div>';
 qs.forEach(function(q,i){h+='<div class="q"><h2><span>Q'+(p*PS+i+1)+'</span>'+q[2]+'</h2>';
  for(var k=0;k<3;k++)h+='<label><input type="radio" name="q'+i+'" value="'+k+'">'+q[3+k]+'</label>';h+='</div>'});
 h+='<button id="go">'+(p<NP-1?'つぎへ ➡️':'回答を完了する 🎉')+'</button><p id="warn" class="c sub"></p>';
 app.innerHTML=h;window.scrollTo(0,0);
 function upd(){var n=app.querySelectorAll("input:checked").length;app.querySelector("#bar i").style.width=(n/qs.length*100)+"%";return n}
 app.onchange=upd;
 document.getElementById("go").onclick=function(){
  if(upd()<qs.length){document.getElementById("warn").textContent="まだ答えてない質問があるよ！";return}
  qs.forEach(function(q,i){AN[p*PS+i]=+app.querySelector('input[name="q'+i+'"]:checked').value});
  if(p<NP-1)page(p+1);else thanks()}}
function thanks(){app.onchange=null;
 var t="🎁誕生日診断の回答コードだよ→ "+AN.join("");
 app.innerHTML='<div class="c"><div class="em">🎉</div><h1>回答ありがとう〜！</h1><p>結果は当日までないしょだよ〜🤫</p><div class="box c">最後に、このボタンでわたしに回答を送ってね👇<button id="sh">💌 回答を送る</button><p id="msg" class="sub"></p></div></div>';
 document.getElementById("sh").onclick=function(){
  var m=document.getElementById("msg");
  if(navigator.share){navigator.share({text:t}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){m.textContent="コピーしたよ！わたしに貼り付けて送ってね"}).catch(function(){m.textContent=t})}
  else m.textContent=t}}
function her(){app.onchange=null;
 app.innerHTML='<h1>🕵️ 結果ルーム（わたし用）</h1><p class="c sub">届いたコードを貼ってね</p><textarea id="cd" placeholder="回答コードを貼り付け"></textarea><button id="ok">結果を見る 🔓</button><p id="er" class="c sub"></p><div id="out"></div>';
 document.getElementById("ok").onclick=function(){
  var d=(document.getElementById("cd").value.match(new RegExp("\\d{"+N+"}"))||[""])[0];
  if(!d){document.getElementById("er").textContent=N+"桁のコードが見つからないよ";return}
  var a=toObj(d),r=rank(a),t=G[r[0][0]],u=G[r[1][0]];
  var more=r.slice(2,4).map(function(x){var g=G[x[0]];return"<b>"+g.e+" "+g.n+"</b><ul>"+pick(g,a,2)+"</ul>"}).join("");
  var boxes="";for(var p=0;p<NP;p++){boxes+='<div class="box"><b>📝 回答 '+(p+1)+'/'+NP+'</b><ul>'+Q.slice(p*PS,p*PS+PS).map(function(q,i){return"<li><span class='sub'>"+q[2]+"</span><br><b>"+q[3+(+d[p*PS+i])]+"</b></li>"}).join("")+'</ul></div>'}
  document.getElementById("out").innerHTML='<div class="c"><div class="em">'+t.e+'</div><div class="sub">彼のジャンルは…</div><h1>'+t.n+'</h1><p>'+t.c+'</p></div>'
  +'<div class="box"><b>💡 プレゼントアイデア</b><ul>'+pick(t,a,3)+'</ul></div>'
  +'<div class="box"><b>🥈 サブ候補：'+u.e+' '+u.n+'</b><ul>'+pick(u,a,2)+'</ul></div>'
  +'<div class="box"><b>🥉 そのほかの候補</b><br>'+more+'</div>'+boxes}}
function route(){if(location.hash==="#her")her();else page(0)}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
